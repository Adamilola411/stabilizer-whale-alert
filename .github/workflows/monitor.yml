name: Stabilizer 2-Min Alchemy-Safe Monitor

on:
  schedule:
    # Runs every 2 minutes to match the 10-block scan range
    - cron: "*/2 * * * *"
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  check-swaps:
    runs-on: ubuntu-latest
    
    # Prevents overlapping runs if GitHub or the RPC is slow
    concurrency: 
      group: stabilizer-monitor
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install ethers@5.7.2 axios

      - name: Run Whale Monitor
        run: node stabilizer-monitor.js
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
